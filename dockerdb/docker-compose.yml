services:
  taiga-db:
    image: postgres:12.3
    environment:
      POSTGRES_DB: "taiga"
      POSTGRES_USER: "taiga"
      POSTGRES_PASSWORD: "taiga"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiga"]
      interval: 2s
      timeout: 15s
      retries: 5
      start_period: 3s
    volumes:
      - ./data:/var/lib/postgresql/data
    #    restart: always
    ports:
      - 5432:5432
  rabbitmq:
    image: rabbitmq:3.8-management-alpine
    ports:
      - 5672:5672
      - 15672:15672
    env_file:
      - ./.env
    hostname: "taiga-events-rabbitmq"
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq

volumes:
  rabbitmq2_data:
